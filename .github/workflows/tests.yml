name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install fastapi==0.115.0 httpx==0.27.0 neo4j==5.25.0 pydantic==2.9.0
      - name: Run unit tests
        run: python scripts/run_backend_tests.py
