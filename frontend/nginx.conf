server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to microservices
    location /api/resolver/ {
        proxy_pass http://resolver:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/recommendation/ {
        proxy_pass http://recommendation-engine:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/registry/ {
        proxy_pass http://service-registry:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/products {
        proxy_pass http://mock-provider:8010/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
