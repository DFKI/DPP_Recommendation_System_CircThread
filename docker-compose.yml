services:
  # --- Data Layer ---
  neo4j:
    image: neo4j:5-community
    container_name: circthread-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-circthread2024}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - circthread-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Service Registry ---
  service-registry:
    build:
      context: .
      dockerfile: services/service_registry/Dockerfile
    container_name: circthread-service-registry
    ports:
      - "8003:8003"
    volumes:
      - registry_data:/app/data
    networks:
      - circthread-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Mock Data Providers ---
  mock-provider:
    build:
      context: .
      dockerfile: services/mock_providers/Dockerfile
    container_name: circthread-mock-provider
    ports:
      - "8010:8010"
    networks:
      - circthread-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8010/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Domain Data Provider: Recycling / End-of-Life ---
  recycling-eol-provider:
    build:
      context: .
      dockerfile: services/recycling_eol_provider/Dockerfile
    container_name: circthread-recycling-eol-provider
    ports:
      - "8021:8021"
    networks:
      - circthread-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8021/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Domain Data Provider: Mid-of-Life / Purchase ---
  midlife-purchase-provider:
    build:
      context: .
      dockerfile: services/midlife_purchase_provider/Dockerfile
    container_name: circthread-midlife-purchase-provider
    ports:
      - "8022:8022"
    networks:
      - circthread-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8022/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Domain Data Provider: AAS Digital Nameplate ---
  aas-nameplate-provider:
    build:
      context: .
      dockerfile: services/aas_nameplate_provider/Dockerfile
    container_name: circthread-aas-nameplate-provider
    ports:
      - "8023:8023"
    volumes:
      - aas_nameplate_data:/app/data
    networks:
      - circthread-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8023/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Domain Data Provider: EU EPREL Product Registry ---
  eprel-provider:
    build:
      context: .
      dockerfile: services/eprel_provider/Dockerfile
    container_name: circthread-eprel-provider
    ports:
      - "8024:8024"
    networks:
      - circthread-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8024/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Domain Data Provider: Repair & Service Network ---
  repair-service-provider:
    build:
      context: .
      dockerfile: services/repair_service_provider/Dockerfile
    container_name: circthread-repair-service-provider
    ports:
      - "8025:8025"
    networks:
      - circthread-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8025/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Recommendation Engine ---
  recommendation-engine:
    build:
      context: .
      dockerfile: services/recommendation_engine/Dockerfile
    container_name: circthread-recommendation-engine
    ports:
      - "8002:8002"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-circthread2024}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - circthread-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Resolver Service ---
  resolver:
    build:
      context: .
      dockerfile: services/resolver/Dockerfile
    container_name: circthread-resolver
    ports:
      - "8001:8001"
    environment:
      - SERVICE_REGISTRY_URL=http://service-registry:8003
      - RECOMMENDATION_ENGINE_URL=http://recommendation-engine:8002
      - MOCK_PROVIDER_URL=http://mock-provider:8010
    depends_on:
      service-registry:
        condition: service_healthy
      recommendation-engine:
        condition: service_healthy
      mock-provider:
        condition: service_healthy
      recycling-eol-provider:
        condition: service_healthy
      midlife-purchase-provider:
        condition: service_healthy
      aas-nameplate-provider:
        condition: service_healthy
      eprel-provider:
        condition: service_healthy
      repair-service-provider:
        condition: service_healthy
    networks:
      - circthread-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: circthread-frontend
    ports:
      - "3000:80"
    depends_on:
      resolver:
        condition: service_healthy
    networks:
      - circthread-network

volumes:
  neo4j_data:
  neo4j_logs:
  registry_data:
  aas_nameplate_data:


networks:
  circthread-network:
    driver: bridge
